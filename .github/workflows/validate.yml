name: 🔍 Validate

on:
  pull_request:
    branches: [ src ]
  workflow_dispatch:

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  issues: write

jobs:
  validate:
    name: Build & Validate
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install dependencies
        run: make sync

      - name: Build production output
        run: make build-prod

      - name: Verify generated output
        run: |
          test -f output/publish/index.html

      - name: Run SEO checks
        run: make seo-check

      - name: Check internal links
        id: check_internal_links
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --config lychee.toml
            --no-progress
            --retry-wait-time 2
            --max-retries 2
            --timeout 20
            --root-dir "${{ github.workspace }}/output/publish"
            --remap '^https://(www\.)?marcsleegers\.com(/.*)?$ file://${{ github.workspace }}/output/publish\$2'
            "${{ github.workspace }}/output/publish/**/*.html"
            "${{ github.workspace }}/output/publish/**/*.xml"

      - name: Comment on PR when internal links fail
        if: failure() && github.event_name == 'pull_request' && steps.check_internal_links.outcome == 'failure' && github.event.pull_request.head.repo.fork == false
        uses: actions/github-script@v9
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [
              "Lychee link validation failed.",
              "",
              `- Run: ${runUrl}`,
              `- Attempt: ${context.runAttempt}`,
            ].join("\n");

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });

      - name: Validation summary
        if: always()
        run: |
          {
            echo "## Validation Summary"
            echo ""
            echo "- Branch: \`${GITHUB_REF_NAME}\`"
            echo "- Commit: \`${GITHUB_SHA}\`"
            echo "- Artifact path: \`output/publish/\`"
          } >> "${GITHUB_STEP_SUMMARY}"
